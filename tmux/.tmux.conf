# ══════════════════════════════════════════════
# tmux config — global
# ══════════════════════════════════════════════

# ── Terminal ──────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── General ───────────────────────────────────
set -g escape-time 10          # reduce Escape delay (critical for vim/neovim)
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g focus-events on
set -g mouse on
set -g renumber-windows on

# 1-based indexing (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# ── Key Bindings ──────────────────────────────

# Reload config — prefix + R
bind R source-file ~/.tmux.conf \; display "  Config reloaded"

# Ripgrep search in a new split — prefix + /
bind / command-prompt -p "rg:" "split-window -v 'rg --color=always %% | less -R'"

# Splits that open in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy Mode (vi) ────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Status Bar ────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Colors (dark theme, cyan accent)
set -g status-style                 "bg=#1a1b26 fg=#a9b1d6"
set -g pane-border-style            "fg=#3b4261"
set -g pane-active-border-style     "fg=#00d4ff"
set -g message-style                "fg=#c0caf5 bg=#1a1b26 bold"
set -g mode-style                   "fg=#1a1b26 bg=#00d4ff bold"
setw -g window-status-style         "fg=#565f89 bg=#1a1b26"
setw -g window-status-current-style "fg=#00d4ff bg=#1a1b26 bold"
setw -g window-status-bell-style    "fg=#f7768e bg=#1a1b26 bold"

# Left: session name pill
set -g status-left-length 30
set -g status-left "#[fg=#1a1b26,bg=#00d4ff,bold]  #S #[bg=#1a1b26,fg=#00d4ff] "

# Window tabs
setw -g window-status-format         " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "

# Right: PREFIX indicator, hostname, date, time
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#f7768e bold]PREFIX  ,}#[fg=#565f89]#H  #[fg=#a9b1d6]%a %d %b  #[fg=#00d4ff,bold]%H:%M "

# ── Suppress bells ────────────────────────────
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ── Tmux prefix Highlight ────────────────────────────
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
set -g @prefix_highlight_fg 'white' # default is 'colour231'
set -g @prefix_highlight_bg 'black'  # default is 'colour04'

# ── Plugins (TPM) ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sensible defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-resurrect'  # save/restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save sessions every 15min
set -g @plugin 'tmux-plugins/tmux-yank'       # clipboard integration (pbcopy)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # hilight tmux prefix when pressed.
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
