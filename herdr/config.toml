onboarding = false
[experimental]
switch_ascii_input_source_in_prefix = true

pane_history = true
[keys]
prefix = "ctrl+a"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_right = ["prefix+l", "prefix+right"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_down = ["prefix+j", "prefix+down"]

[[keys.command]]
key = "prefix+a"
command = "bash $HOME/.config/herdr/scripts/send-all-panes.sh"
type = "shell"
description = "Prompt for input, then send to all panes in this workspace"

[[keys.command]]
key = "prefix+shift+l"
command = "bash $HOME/.config/herdr/scripts/label-panes.sh"
type = "shell"
description = "Label all panes with their short IDs"

[[keys.command]]
key = "prefix+e"
command = "nvim ."
type = "pane"
description = "Open Neovim in current directory"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "herdr"

[theme]
name = "vesper"
auto_switch = false
